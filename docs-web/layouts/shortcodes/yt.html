
{{- $id := .Get 0 | default "" -}}
{{- $title := .Get 1 | default "Vídeo de YouTube" -}}
{{- $validID := gt (len (findRE "^[A-Za-z0-9_-]{11}$" $id)) 0 -}}

{{- if $validID -}}
<div class="video video--consent" data-youtube-id="{{ $id }}" data-video-title="{{ $title }}">
  <div class="video-consent-placeholder">
    <div class="video-consent-content">
      <span class="video-consent-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/>
        </svg>
      </span>

      <p class="video-consent-message">
      </p>

      <p class="video-consent-privacy">
      </p>

      <button class="video-consent-button" type="button">
        Aceptar y reproducir
      </button>
    </div>
  </div>
</div>
{{- else -}}
<div class="video video--error" role="note">
  <p>El identificador del vídeo de YouTube no es válido. Debe tener 11 caracteres.</p>
</div>
{{- end -}}
