{{ define "main" }}
<div class="content-layout page-layout">
  <div class="page-sidebar-space" aria-hidden="true"></div>

  <main class="content-main">
    <article class="markdown">
      <h1>{{ .Title }}</h1>
      {{ .Content }}
    </article>
  </main>

  <aside class="content-toc">
    {{ if .Fragments.Headings }}
      <div class="toc-title">En esta página</div>
      {{ .TableOfContents }}
    {{ end }}
  </aside>
</div>
{{ end }}
