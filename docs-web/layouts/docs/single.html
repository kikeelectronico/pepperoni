{{ define "main" }}
<div class="content-layout docs-layout">
  <aside class="docs-sidebar">
    {{ partial "sidebar.html" . }}
  </aside>

  <main class="content-main">
    <article class="markdown">
      <h1>{{ .Title }}</h1>
      {{ .Content }}
    </article>
  </main>

  <aside class="content-toc">
    {{ if .Fragments.Headings }}
      <div class="toc-title">En esta página</div>
      {{ .TableOfContents }}
    {{ end }}
  </aside>
</div>
{{ end }}
