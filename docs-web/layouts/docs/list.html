{{ define "main" }}
<div class="docs-layout">
  <aside class="sidebar">{{ partial "sidebar.html" . }}</aside>
  <main class="doc-main">
    <article class="markdown">
      <h1>{{ .Title }}</h1>
      {{ .Content }}
      <ul class="doc-cards">
        {{ range .Pages.ByWeight }}
        <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
        {{ end }}
      </ul>
    </article>
  </main>
  <aside class="toc"></aside>
</div>
{{ end }}
