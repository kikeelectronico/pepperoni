{{ define "main" }}
<div class="content-layout docs-layout">
  <aside class="docs-sidebar">{{ partial "sidebar.html" . }}</aside>
  <main class="content-main">
    <article class="markdown">
      <h1>{{ .Title }}</h1>
      {{ .Content }}
      <ul class="docs-cards">
        {{ range .Pages.ByWeight }}
        <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
        {{ end }}
      </ul>
    </article>
  </main>
  <aside class="content-toc" aria-hidden="true"></aside>
</div>
{{ end }}
